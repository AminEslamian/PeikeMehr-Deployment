{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | سامانه گزارش معلمان</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;

            --background: #f6f7fb;
            --card: #ffffff;

            --text: #171923;
            --muted: #6b7280;

            --border: #e5e7eb;

            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;

            --warning: #d97706;
            --warning-bg: #fffbeb;
            --warning-border: #fde68a;

            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;

            --shadow: 0 20px 50px rgba(15, 23, 42, 0.10);

            --radius: 20px;
            --transition: 0.2s ease;
        }

        [data-theme="dark"] {
            --background: #111318;
            --card: #1d2129;

            --text: #f3f4f6;
            --muted: #9ca3af;

            --border: #303540;

            --danger: #f87171;
            --danger-bg: rgba(127, 29, 29, 0.22);
            --danger-border: rgba(248, 113, 113, 0.35);

            --warning: #fbbf24;
            --warning-bg: rgba(120, 53, 15, 0.22);
            --warning-border: rgba(251, 191, 36, 0.35);

            --success: #4ade80;
            --success-bg: rgba(20, 83, 45, 0.22);
            --success-border: rgba(74, 222, 128, 0.35);

            --shadow: 0 20px 50px rgba(0, 0, 0, 0.30);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Vazirmatn", sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(79, 70, 229, 0.10),
                    transparent 35%
                ),
                var(--background);

            color: var(--text);

            transition:
                background-color var(--transition),
                color var(--transition);
        }

        .auth-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 16px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            position: relative;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);

            padding: 38px 34px;

            overflow: hidden;
        }

        .auth-card::before {
            content: "";

            position: absolute;

            top: 0;
            right: 0;
            left: 0;

            height: 4px;

            background: linear-gradient(
                90deg,
                var(--primary),
                var(--primary-dark)
            );
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-icon {
            width: 68px;
            height: 68px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );

            color: white;

            font-size: 30px;

            box-shadow:
                0 10px 25px rgba(79, 70, 229, 0.25);
        }

        .auth-title {
            margin: 0 0 8px;

            font-size: 24px;
            font-weight: 800;

            color: var(--text);
        }

        .auth-description {
            margin: 0;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.8;
        }

        /* =========================
           Error Alert
        ========================= */

        .error-alert {
            display: none;

            align-items: flex-start;
            gap: 12px;

            margin-bottom: 20px;

            padding: 13px 14px;

            border: 1px solid var(--danger-border);
            border-radius: 13px;

            background: var(--danger-bg);

            color: var(--danger);

            animation: alertIn 0.2s ease;
        }

        .error-alert.show {
            display: flex;
        }

        .error-alert-icon {
            width: 28px;
            height: 28px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
        }

        .error-alert-content {
            flex: 1;
            min-width: 0;
        }

        .error-alert-title {
            margin: 1px 0 3px;

            font-size: 13px;
            font-weight: 800;
        }

        .error-alert-message {
            margin: 0;

            font-size: 12px;
            line-height: 1.8;

            color: var(--muted);
        }

        .error-alert-close {
            width: 28px;
            height: 28px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 8px;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            transition: all var(--transition);
        }

        .error-alert-close:hover {
            background: rgba(127, 29, 29, 0.08);
            color: var(--danger);
        }

        @keyframes alertIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           Form
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            color: var(--text);

            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            top: 50%;
            right: 14px;

            transform: translateY(-50%);

            color: var(--muted);

            font-size: 18px;

            pointer-events: none;

            transition: color var(--transition);
        }

        .form-control {
            width: 100%;

            height: 50px;

            padding: 0 46px 0 14px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background: var(--card);

            color: var(--text);

            font-family: "Vazirmatn", sans-serif;
            font-size: 14px;

            outline: none;

            transition:
                border-color var(--transition),
                box-shadow var(--transition),
                background-color var(--transition);
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .form-control:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--primary);
        }

        .form-control.input-error {
            border-color: var(--danger);
        }

        .form-control.input-error:focus {
            box-shadow:
                0 0 0 3px rgba(220, 38, 38, 0.10);
        }

        .field-error {
            display: none;

            margin-top: 7px;

            color: var(--danger);

            font-size: 11px;
            font-weight: 500;
        }

        .field-error.show {
            display: block;
        }

        .phone-hint {
            margin-top: 7px;

            color: var(--muted);

            font-size: 11px;
            line-height: 1.7;
        }

        /* =========================
           Submit
        ========================= */

        .submit-button {
            width: 100%;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );

            color: white;

            font-family: "Vazirmatn", sans-serif;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(79, 70, 229, 0.20);

            transition:
                transform var(--transition),
                box-shadow var(--transition),
                opacity var(--transition);
        }

        .submit-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 22px rgba(79, 70, 229, 0.28);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 17px;
            height: 17px;

            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: white;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           Footer
        ========================= */

        .auth-footer {
            margin-top: 25px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;
        }

        .auth-footer a {
            color: var(--primary);

            font-weight: 700;

            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            margin-top: 18px;

            color: var(--muted);

            font-size: 12px;

            text-decoration: none;

            transition: color var(--transition);
        }

        .back-home:hover {
            color: var(--primary);
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 576px) {
            .auth-page {
                padding: 20px 12px;
            }

            .auth-card {
                padding: 30px 22px;
                border-radius: 17px;
            }

            .auth-title {
                font-size: 21px;
            }

            .auth-icon {
                width: 62px;
                height: 62px;

                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="auth-page">

    <div class="auth-wrapper">

        <div class="auth-card">

            <!-- Header -->
            <div class="auth-header">

                <div class="auth-icon">
                    <i class="bi bi-box-arrow-in-right"></i>
                </div>

                <h1 class="auth-title">
                    ورود به سامانه
                </h1>

                <p class="auth-description">
                    شماره موبایل خود را وارد کنید تا کد تأیید برای شما ارسال شود.
                </p>

            </div>


            <!-- Error Alert -->
            <div
                id="errorAlert"
                class="error-alert"
                role="alert"
                aria-live="polite"
            >

                <div
                    class="error-alert-icon"
                    id="errorAlertIcon"
                >
                    <i class="bi bi-exclamation-circle-fill"></i>
                </div>

                <div class="error-alert-content">

                    <p
                        class="error-alert-title"
                        id="errorAlertTitle"
                    ></p>

                    <p
                        class="error-alert-message"
                        id="errorAlertMessage"
                    ></p>

                </div>

                <button
                    type="button"
                    class="error-alert-close"
                    id="errorAlertClose"
                    aria-label="بستن"
                >
                    <i class="bi bi-x-lg"></i>
                </button>

            </div>


            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <div class="form-group">

                    <label
                        for="phoneNumber"
                        class="form-label"
                    >
                        شماره موبایل
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-phone input-icon"></i>

                        <input
                            type="tel"
                            id="phoneNumber"
                            name="phone_number"
                            class="form-control"
                            placeholder="مثلاً 09123456789"
                            maxlength="11"
                            inputmode="numeric"
                            autocomplete="tel"
                            dir="ltr"
                        >

                    </div>

                    <div
                        id="phoneError"
                        class="field-error"
                    ></div>

                    <div class="phone-hint">
                        شماره موبایل باید با 09 شروع شود و 11 رقم داشته باشد.
                    </div>

                </div>


                <button
                    type="submit"
                    id="submitButton"
                    class="submit-button"
                >
                    <span id="submitText">
                        دریافت کد ورود
                    </span>

                    <span
                        id="submitSpinner"
                        class="spinner"
                        style="display: none;"
                    ></span>

                    <i
                        id="submitIcon"
                        class="bi bi-arrow-left"
                    ></i>
                </button>

            </form>


            <!-- Footer -->
            <div class="auth-footer">

                حساب کاربری ندارید؟
                <a href="/register/">
                    ثبت‌نام کنید
                </a>

                <br>

                <a
                    href="/"
                    class="back-home"
                >
                    <i class="bi bi-arrow-right"></i>
                    بازگشت به صفحه اصلی
                </a>

            </div>

        </div>

    </div>

</div>


<script>

    const loginForm = document.getElementById("loginForm");
    const phoneInput = document.getElementById("phoneNumber");

    const submitButton = document.getElementById("submitButton");
    const submitText = document.getElementById("submitText");
    const submitSpinner = document.getElementById("submitSpinner");
    const submitIcon = document.getElementById("submitIcon");

    const errorAlert = document.getElementById("errorAlert");
    const errorAlertTitle = document.getElementById("errorAlertTitle");
    const errorAlertMessage = document.getElementById("errorAlertMessage");
    const errorAlertIcon = document.getElementById("errorAlertIcon");
    const errorAlertClose = document.getElementById("errorAlertClose");

    const phoneError = document.getElementById("phoneError");


    /* =========================================
       Convert Persian / Arabic numbers
    ========================================= */

    function convertToEnglishDigits(value) {

        const persianDigits = "۰۱۲۳۴۵۶۷۸۹";
        const arabicDigits = "٠١٢٣٤٥٦٧٨٩";

        return value
            .split("")
            .map(char => {

                const persianIndex = persianDigits.indexOf(char);

                if (persianIndex !== -1) {
                    return String(persianIndex);
                }

                const arabicIndex = arabicDigits.indexOf(char);

                if (arabicIndex !== -1) {
                    return String(arabicIndex);
                }

                return char;
            })
            .join("");
    }


    /* =========================================
       Error UI
    ========================================= */

    function hideError() {

        errorAlert.classList.remove("show");

        errorAlertTitle.textContent = "";
        errorAlertMessage.textContent = "";

    }


    function showError(title, message) {

        errorAlertTitle.textContent = title;
        errorAlertMessage.textContent = message;

        errorAlert.classList.add("show");

        errorAlert.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });
    }


    function showFieldError(message) {

        phoneInput.classList.add("input-error");

        phoneError.textContent = message;

        phoneError.classList.add("show");
    }


    function clearFieldError() {

        phoneInput.classList.remove("input-error");

        phoneError.textContent = "";

        phoneError.classList.remove("show");
    }


    errorAlertClose.addEventListener("click", function () {
        hideError();
    });


    /* =========================================
       Input
    ========================================= */

    phoneInput.addEventListener("input", function () {

        let value = convertToEnglishDigits(this.value);

        value = value.replace(/\D/g, "");

        value = value.substring(0, 11);

        this.value = value;

        clearFieldError();
        hideError();
    });


    /* =========================================
       Friendly Backend Errors
    ========================================= */

    function getFriendlyError(data, status) {

        /*
         * Backend should ideally return:
         *
         * {
         *     "error_code": "phone_not_found"
         * }
         *
         * But this function also handles older responses.
         */

        const errorCode = data?.error_code;


        /* شماره پیدا نشد */

        if (
            errorCode === "phone_not_found" ||
            errorCode === "user_not_found"
        ) {

            return {
                title: "حساب کاربری پیدا نشد",
                message: "برای این شماره موبایل حساب کاربری‌ای ثبت نشده است."
            };
        }


        /* شماره نامعتبر */

        if (errorCode === "invalid_phone") {

            return {
                title: "شماره موبایل نامعتبر است",
                message: "لطفاً یک شماره موبایل معتبر ۱۱ رقمی وارد کنید."
            };
        }


        /* محدودیت درخواست */

        if (errorCode === "otp_rate_limit") {

            return {
                title: "تعداد درخواست‌ها زیاد است",
                message: "لطفاً چند لحظه صبر کنید و دوباره تلاش کنید."
            };
        }


        /* خطای سرویس پیامک */

        if (errorCode === "sms_service_error") {

            return {
                title: "ارسال کد انجام نشد",
                message: "در حال حاضر ارسال پیامک با مشکل مواجه شده است. دوباره تلاش کنید."
            };
        }


        /* DRF field error */

        if (data?.phone_number) {

            return {
                title: "شماره موبایل نامعتبر است",
                message: "لطفاً شماره موبایل واردشده را بررسی کنید."
            };
        }


        /* HTTP status */

        if (status === 400) {

            return {
                title: "اطلاعات واردشده صحیح نیست",
                message: "لطفاً شماره موبایل را بررسی کنید."
            };
        }


        if (status === 404) {

            return {
                title: "حساب کاربری پیدا نشد",
                message: "برای این شماره موبایل حساب کاربری‌ای ثبت نشده است."
            };
        }


        if (status === 429) {

            return {
                title: "تعداد درخواست‌ها زیاد است",
                message: "لطفاً کمی صبر کنید و دوباره تلاش کنید."
            };
        }


        if (status >= 500) {

            return {
                title: "خطا در سامانه",
                message: "مشکلی در سمت سرور رخ داده است. لطفاً بعداً دوباره تلاش کنید."
            };
        }


        return {
            title: "ارسال کد انجام نشد",
            message: "لطفاً اطلاعات را بررسی کنید و دوباره تلاش کنید."
        };
    }


    /* =========================================
       Loading State
    ========================================= */

    function setLoading(isLoading) {

        submitButton.disabled = isLoading;

        if (isLoading) {

            submitText.textContent = "در حال ارسال...";

            submitSpinner.style.display = "block";

            submitIcon.style.display = "none";

        } else {

            submitText.textContent = "دریافت کد ورود";

            submitSpinner.style.display = "none";

            submitIcon.style.display = "block";
        }
    }


    /* =========================================
       Submit
    ========================================= */

    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        hideError();
        clearFieldError();


        let phone = convertToEnglishDigits(
            phoneInput.value.trim()
        );

        phone = phone.replace(/\D/g, "");


        /* =========================
           Validation
        ========================= */

        if (!phone) {

            showFieldError(
                "لطفاً شماره موبایل خود را وارد کنید."
            );

            phoneInput.focus();

            return;
        }


        if (phone.length !== 11) {

            showFieldError(
                "شماره موبایل باید دقیقاً ۱۱ رقم باشد."
            );

            phoneInput.focus();

            return;
        }


        if (!phone.startsWith("09")) {

            showFieldError(
                "شماره موبایل باید با 09 شروع شود."
            );

            phoneInput.focus();

            return;
        }


        phoneInput.value = phone;

        setLoading(true);


        try {

            const response = await fetch(
                "/api/auth/login/send-otp/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        phone_number: phone
                    })
                }
            );


            let data = {};

            try {
                data = await response.json();
            } catch (error) {
                data = {};
            }


            /* =========================
               Error
            ========================= */

            if (!response.ok) {

                const friendlyError =
                    getFriendlyError(
                        data,
                        response.status
                    );


                showError(
                    friendlyError.title,
                    friendlyError.message
                );


                /*
                 * اگر شماره پیدا نشده،
                 * خود فیلد هم مشخص می‌شود.
                 */

                if (
                    data?.error_code === "phone_not_found" ||
                    data?.error_code === "user_not_found" ||
                    response.status === 404
                ) {

                    showFieldError(
                        "برای این شماره حساب کاربری پیدا نشد."
                    );
                }


                return;
            }


            /* =========================
               Success
            ========================= */

            sessionStorage.setItem(
                "login_phone",
                phone
            );


            window.location.href =
                "/login/verify/";

        } catch (error) {

            console.error(
                "Login request error:",
                error
            );


            showError(
                "ارتباط با سامانه برقرار نشد",
                "لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید."
            );

        } finally {

            setLoading(false);
        }

    });

</script>

</body>
</html>
