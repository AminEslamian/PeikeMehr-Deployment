# Production database override.
#
# Usage (after adding POSTGRES_* credentials to .env):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# This starts PostgreSQL on a private Docker network (no host port). The
# SQLite volume is left untouched and is not used when POSTGRES_DB is set.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=60
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    shm_size: 256mb
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
